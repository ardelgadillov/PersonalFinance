# Home Assistant add-on manifest. See INSTALL_HOMEASSISTANT.md for how to install.
# This file lives at the repo root so the whole app is the Docker build context.
name: Personal Finance
version: "0.1.0"
slug: personalfinance
description: "Personal finance tracker (SimpleFIN + Empower): cash flow, net worth, investments."
url: https://github.com/ardelgadillov/PersonalFinance
# Built locally for whatever architecture your Home Assistant host runs.
arch:
  - aarch64
  - amd64
  - armv7
# We provide our own CMD (no s6 init layer).
init: false
# Serve through the Home Assistant sidebar (ingress) instead of exposing a port.
ingress: true
ingress_port: 8099
panel_icon: mdi:finance
panel_title: Finance
# Needed so the app can read its own ingress path from the Supervisor API.
hassio_api: true
# User-editable configuration (shown on the add-on's Configuration tab).
options:
  simplefin_access_url: ""
  timezone: America/New_York
  daily_sync_hour: 3
  sync_max_age_hours: 12
schema:
  simplefin_access_url: str?
  timezone: str
  daily_sync_hour: int(0,23)
  sync_max_age_hours: float(0,)
